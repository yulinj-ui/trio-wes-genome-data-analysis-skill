# 由本机 `conda env export -n trio --no-builds` 提取顶层工具版本（2026-10-01）。
# 只锁顶层包、不锁 osx-arm64 专有的传递依赖，故本机 conda 与容器（linux/amd64、linux/arm64）共用同一份。
# ⛔ 不装 ensembl-vep / perl-bio-samtools：会把 samtools 拖回 0.1.19（且 VEP 在 arm64 段错误）。
# ⚠️ samtools 1.22+ 默认写 CRAM 3.1，GATK 4.6 只认 3.0 —— 02 已显式加 --output-fmt-option version=3.0。
name: trio
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - perl=5.32.1            # ANNOVAR table_annovar.pl 需要（ANNOVAR 本体不进镜像）
  - openjdk=25.0.2         # snpEff/SnpSift/GATK；缺 JDK 时 snpEff 会静默注释 0 条
  - bwa-mem2=2.3
  - samtools=1.23.1        # 必须 >=1.20
  - bcftools=1.24
  - htslib=1.23.1
  - tabix=1.11
  - gatk4=4.6.2.0
  - fastp=1.3.6
  - fastqc=0.12.1
  - multiqc=1.35
  - snpeff=5.4.0c
  - snpsift=5.4.0c
  - mosdepth=0.3.14
  - slivar=0.3.4
  - bedtools=2.31.1
  - somalier=0.3.2
  - verifybamid2=2.0.3
  - rtg-tools=3.13
  - seqkit=2.13.0
  - curl
  - unzip
  - pigz
